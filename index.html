<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Utopia Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0b0f19;
      color: #f3f4f6;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* Модальное окно авторизации */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #080c14;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background: #111726;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 28px 22px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-card h2 {
      font-size: 1.35rem;
      color: #38bdf8;
      text-align: center;
      font-weight: 700;
    }
    .auth-card input, .auth-card button {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      border: 1px solid #243048;
      background: #090d16;
      color: #fff;
      outline: none;
    }
    .auth-card button {
      background: #0284c7;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-card button:hover { background: #0369a1; }

    /* Оболочка приложения */
    #app {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Боковая панель чатов */
    aside {
      width: 320px;
      background: #0d131f;
      border-right: 1px solid #1a2333;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #1a2333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #101726;
    }
    .profile-info {
      font-weight: 700;
      color: #38bdf8;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .settings-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
    }
    .settings-btn:hover { background: #1e293b; color: #fff; }

    .chat-controls {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #1a2333;
    }
    .chat-controls button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #161f30;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      padding: 14px 16px;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      font-size: 14px;
      color: #cbd5e1;
      transition: background 0.15s;
    }
    .chat-item:hover { background: #141d2e; }
    .chat-item.active { background: #0284c7; color: #fff; font-weight: 600; }

    /* Окно диалога */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #080c14;
      height: 100%;
    }
    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid #1a2333;
      background: #0d131f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mobile-back-btn {
      display: none;
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 20px;
      cursor: pointer;
    }
    .invite-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      word-break: break-word;
      position: relative;
    }
    .msg.mine {
      align-self: flex-end;
      background: #0369a1;
      border-bottom-right-radius: 4px;
    }
    .msg.other {
      align-self: flex-start;
      background: #151d2c;
      border-bottom-left-radius: 4px;
    }
    .msg-author {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
    }
    .msg.mine .msg-author { color: #bae6fd; }
    .msg-time {
      font-size: 10px;
      opacity: 0.6;
      align-self: flex-end;
      margin-top: 2px;
    }

    /* Медиаплееры внутри сообщений */
    .msg-media-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      margin-top: 4px;
      cursor: pointer;
      object-fit: cover;
    }
    .msg-media-video {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
      margin-top: 4px;
    }
    .msg-media-audio {
      width: 240px;
      height: 38px;
      margin-top: 4px;
      outline: none;
    }

    /* Нижняя панель ввода и действий */
    .chat-input-bar {
      padding: 12px 16px;
      background: #0d131f;
      border-top: 1px solid #1a2333;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
    }
    .action-btn:hover { background: #161f30; color: #fff; }
    .action-btn.recording {
      color: #ef4444;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 20px;
      border: 1px solid #1e293b;
      background: #080c14;
      color: #fff;
      outline: none;
      font-size: 14px;
    }
    .send-btn {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    /* Окно настроек */
    #settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .settings-card {
      background: #111726;
      border: 1px solid #1e293b;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
      border-bottom: 1px solid #1a2333;
      padding-bottom: 10px;
    }
    .settings-row span.val { color: #38bdf8; font-weight: 600; }
    .logout-btn {
      padding: 10px;
      border-radius: 8px;
      background: #dc2626;
      border: none;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    /* Адаптивность для телефонов */
    @media (max-width: 768px) {
      aside {
        width: 100vw;
        position: absolute;
        inset: 0;
      }
      main {
        width: 100vw;
        position: absolute;
        inset: 0;
        display: none;
      }
      .mobile-back-btn { display: inline-block; }
    }
  </style>
</head>
<body>

  <!-- Авторизация -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>Utopia Messenger</h2>
      <p style="font-size: 12px; color: #94a3b8; text-align: center;">Вход сохраняется на телефоне навсегда</p>
      <input type="text" id="login-nick" placeholder="Ваш никнейм" autocomplete="off">
      <input type="password" id="login-pwd" placeholder="Пароль">
      <button id="auth-btn">Войти в сеть</button>
      <div id="auth-error" style="color: #f87171; font-size: 12px; text-align: center;"></div>
    </div>
  </div>

  <!-- Главный экран -->
  <div id="app">
    <aside id="chat-aside">
      <div class="sidebar-header">
        <div class="profile-info">
          <span>●</span>
          <span id="profile-nick">@nick</span>
        </div>
        <button class="settings-btn" id="open-settings-btn">⚙️</button>
      </div>
      <div class="chat-controls">
        <button id="new-chat-btn">+ Создать чат</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </aside>

    <main id="chat-main">
      <div class="chat-header">
        <div class="header-left">
          <button class="mobile-back-btn" id="mobile-back-btn">←</button>
          <h3 id="current-chat-title" style="font-size: 15px;">🌐 Общий чат</h3>
        </div>
        <button id="invite-btn" class="invite-btn" style="display: none;">+ Пригласить</button>
      </div>
      <div class="messages-box" id="messages-box"></div>
      
      <div class="chat-input-bar">
        <!-- Кнопка загрузки файлов до 10 МБ -->
        <input type="file" id="file-input" style="display: none;" accept="image/*,video/*,audio/*">
        <button class="action-btn" id="attach-btn" title="Прикрепить файл до 10 МБ">📎</button>

        <!-- Кнопка записи голосового -->
        <button class="action-btn" id="voice-btn" title="Записать голосовое">🎙️</button>

        <input type="text" id="msg-input" placeholder="Сообщение..." autocomplete="off">
        <button class="send-btn" id="send-msg-btn">➤</button>
      </div>
    </main>
  </div>

  <!-- Окно настроек -->
  <div id="settings-modal">
    <div class="settings-card">
      <h3 style="color: #38bdf8;">Настройки</h3>
      <div class="settings-row">
        <span>Аккаунт:</span>
        <span class="val" id="set-nick">@user</span>
      </div>
      <div class="settings-row">
        <span>Автосохранение сессии:</span>
        <span class="val" style="color: #22c55e;">Включено</span>
      </div>
      <div class="settings-row">
        <span>Лимит медиа/ГС:</span>
        <span class="val">до 10 МБ</span>
      </div>
      <button class="logout-btn" id="logout-btn">Выйти из аккаунта</button>
      <button style="padding: 8px; border-radius: 8px; border: 1px solid #243048; background: transparent; color: #fff; cursor: pointer;" id="close-settings-btn">Закрыть</button>
    </div>
  </div>

  <script>
    const BACKEND_URL = "https://utopia-messenger-api.onrender.com";

    let currentUser = null;
    let activeChatId = "general";
    let activeWs = null;

    // Голосовые
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // Автоматическая проверка сохраненной сессии
    window.addEventListener('DOMContentLoaded', () => {
      const savedAuth = localStorage.getItem('utopia_saved_user');
      if (savedAuth) {
        try {
          const creds = JSON.parse(savedAuth);
          loginAction(creds.nickname, creds.password, true);
        } catch (e) {
          localStorage.removeItem('utopia_saved_user');
        }
      }
    });

    // Авторизация
    async function loginAction(nickname, password, isAuto = false) {
      const errBox = document.getElementById('auth-error');
      errBox.innerText = isAuto ? 'Авторизация...' : '';

      try {
        const res = await fetch(`${BACKEND_URL}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, password })
        });
        const data = await res.json();

        if (data.status === 'ok') {
          currentUser = nickname;
          // Сохраняем сессию в localStorage
          localStorage.setItem('utopia_saved_user', JSON.stringify({ nickname, password }));

          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          document.getElementById('profile-nick').innerText = '@' + currentUser;
          document.getElementById('set-nick').innerText = '@' + currentUser;

          await fetch(`${BACKEND_URL}/chats`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: 'general', name: '🌐 Общий чат', created_by: currentUser })
          });

          await loadChats();
          switchChat('general', '🌐 Общий чат');
        } else {
          errBox.innerText = data.msg;
          if (isAuto) localStorage.removeItem('utopia_saved_user');
        }
      } catch (e) {
        errBox.innerText = 'Сервер выходит из сна... Подождите 30 секунд и нажмите снова.';
      }
    }

    document.getElementById('auth-btn').addEventListener('click', () => {
      const nickname = document.getElementById('login-nick').value.trim();
      const password = document.getElementById('login-pwd').value;
      if (!nickname || !password) return alert('Заполните логин и пароль!');
      loginAction(nickname, password);
    });

    // Настройки и выход
    document.getElementById('open-settings-btn').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'flex';
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      document.getElementById('settings-modal').style.display = 'none';
    });
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('utopia_saved_user');
      location.reload();
    });

    // Адаптивная мобильная кнопка "Назад"
    document.getElementById('mobile-back-btn').addEventListener('click', () => {
      document.getElementById('chat-main').style.display = 'none';
      document.getElementById('chat-aside').style.display = 'flex';
    });

    // Загрузка комнат
    async function loadChats() {
      try {
        const res = await fetch(`${BACKEND_URL}/chats/${currentUser}`);
        const chats = await res.json();
        const listEl = document.getElementById('chat-list');
        listEl.innerHTML = '';

        chats.forEach(c => {
          const div = document.createElement('div');
          div.className = `chat-item ${c.id === activeChatId ? 'active' : ''}`;
          div.innerText = c.name;
          div.onclick = () => {
            switchChat(c.id, c.name);
            if (window.innerWidth <= 768) {
              document.getElementById('chat-aside').style.display = 'none';
              document.getElementById('chat-main').style.display = 'flex';
            }
          };
          listEl.appendChild(div);
        });
      } catch (e) {
        console.error(e);
      }
    }

    // Переключение чата и WebSocket
    async function switchChat(chatId, chatName) {
      activeChatId = chatId;
      document.getElementById('current-chat-title').innerText = chatName;
      document.getElementById('invite-btn').style.display = chatId === 'general' ? 'none' : 'block';

      document.querySelectorAll('.chat-item').forEach(el => {
        el.classList.toggle('active', el.innerText === chatName);
      });

      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      try {
        const res = await fetch(`${BACKEND_URL}/messages/${chatId}`);
        const history = await res.json();
        history.forEach(renderMessage);
      } catch (e) {
        console.error(e);
      }

      if (activeWs) activeWs.close();
      const wsProtocol = BACKEND_URL.startsWith('https') ? 'wss://' : 'ws://';
      const wsHost = BACKEND_URL.replace(/^https?:\/\//, '');
      activeWs = new WebSocket(`${wsProtocol}${wsHost}/ws/${chatId}`);

      activeWs.onmessage = (event) => {
        renderMessage(JSON.parse(event.data));
      };
    }

    // Отображение сообщений (текст, медиа, аудио)
    function renderMessage(msg) {
      const box = document.getElementById('messages-box');
      const isMine = msg.sender === currentUser;
      const el = document.createElement('div');
      el.className = `msg ${isMine ? 'mine' : 'other'}`;

      let mediaHtml = '';
      if (msg.file_url) {
        const fullUrl = BACKEND_URL + msg.file_url;
        if (msg.file_type === 'image') {
          mediaHtml = `<img src="${fullUrl}" class="msg-media-img" onclick="window.open('${fullUrl}')">`;
        } else if (msg.file_type === 'video') {
          mediaHtml = `<video src="${fullUrl}" controls class="msg-media-video" playsinline></video>`;
        } else if (msg.file_type === 'audio') {
          mediaHtml = `<audio src="${fullUrl}" controls class="msg-media-audio"></audio>`;
        }
      }

      el.innerHTML = `
        <div class="msg-author">${msg.sender}</div>
        ${msg.text ? `<div>${msg.text}</div>` : ''}
        ${mediaHtml}
        <div class="msg-time">${msg.time || new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
      `;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    // Отправка текстового сообщения
    function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activeWs || activeWs.readyState !== WebSocket.OPEN) return;

      activeWs.send(JSON.stringify({
        sender: currentUser,
        text: text,
        file_url: null,
        file_type: null,
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      }));
      input.value = '';
    }

    document.getElementById('send-msg-btn').addEventListener('click', sendMsg);
    document.getElementById('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

    // Отправка файлов (фото, гифки, видео до 10 МБ)
    const fileInput = document.getElementById('file-input');
    document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        alert('Файл слишком большой! Лимит — 10 МБ.');
        fileInput.value = '';
        return;
      }

      let type = 'file';
      if (file.type.startsWith('image/')) type = 'image';
      else if (file.type.startsWith('video/')) type = 'video';
      else if (file.type.startsWith('audio/')) type = 'audio';

      const attachBtn = document.getElementById('attach-btn');
      attachBtn.innerText = '⏳';

      try {
        const res = await fetch(`${BACKEND_URL}/upload?filename=${encodeURIComponent(file.name)}`, {
          method: 'POST',
          body: file
        });
        const data = await res.json();

        if (data.status === 'ok' && activeWs && activeWs.readyState === WebSocket.OPEN) {
          activeWs.send(JSON.stringify({
            sender: currentUser,
            text: '',
            file_url: data.url,
            file_type: type,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
          }));
        }
      } catch (err) {
        alert('Ошибка загрузки файла!');
      } finally {
        attachBtn.innerText = '📎';
        fileInput.value = '';
      }
    });

    // Запись и отправка голосовых сообщений (до 10 МБ)
    const voiceBtn = document.getElementById('voice-btn');
    voiceBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if (audioBlob.size > 10 * 1024 * 1024) {
              alert('Голосовое сообщение превышает 10 МБ!');
              return;
            }

            voiceBtn.innerText = '⏳';
            try {
              const res = await fetch(`${BACKEND_URL}/upload?filename=voice_${Date.now()}.webm`, {
                method: 'POST',
                body: audioBlob
              });
              const data = await res.json();

              if (data.status === 'ok' && activeWs && activeWs.readyState === WebSocket.OPEN) {
                activeWs.send(JSON.stringify({
                  sender: currentUser,
                  text: '',
                  file_url: data.url,
                  file_type: 'audio',
                  time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                }));
              }
            } catch (e) {
              alert('Не удалось отправить голосовое!');
            } finally {
              voiceBtn.innerText = '🎙️';
              voiceBtn.classList.remove('recording');
            }
          };

          mediaRecorder.start();
          isRecording = true;
          voiceBtn.innerText = '⏹️';
          voiceBtn.classList.add('recording');
        } catch (err) {
          alert('Доступ к микрофону заблокирован в браузере!');
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
      }
    });

    // Создание комнат и инвайты
    document.getElementById('new-chat-btn').addEventListener('click', async () => {
      const name = prompt('Название новой комнаты:');
      if (!name) return;
      const id = 'chat_' + Date.now();

      await fetch(`${BACKEND_URL}/chats`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, created_by: currentUser })
      });

      await loadChats();
      switchChat(id, name);
    });

    document.getElementById('invite-btn').addEventListener('click', async () => {
      const friend = prompt('Никнейм собеседника:');
      if (!friend) return;

      const res = await fetch(`${BACKEND_URL}/invite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: activeChatId, nickname: friend })
      });
      const data = await res.json();
      if (data.status === 'ok') alert(`@${friend} добавлен!`);
      else alert(data.msg);
    });
  </script>
</body>
