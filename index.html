<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CyberLink Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07070b; --glass-bg: rgba(20, 20, 35, 0.9); --glass-border: rgba(0, 255, 204, 0.2);
            --neon-accent: #00ffcc; --neon-magenta: #ff007f; --text-main: #e2e8f0; --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { font-family: 'Montserrat', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100dvh; width: 100vw; overflow: hidden; }

        .app-container { display: flex; width: 100%; height: 100%; position: relative; }

        /* Затемнение фона при открытом меню на телефоне */
        .sidebar-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; }
        .sidebar-overlay.active { display: block; }

        /* Боковое меню */
        .sidebar { position: absolute; left: 0; top: 0; width: 260px; height: 100%; background: var(--bg-dark); border-right: 1px solid var(--glass-border); z-index: 1000; transform: translateX(-100%); transition: 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.mobile-open { transform: translateX(0); }
        
        .sidebar-header { padding: 15px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .my-profile-info { font-size: 13px; color: var(--neon-accent); font-weight: 600; }
        .close-menu-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }

        .contacts-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .contact-item { padding: 12px; background: rgba(255,255,255,0.05); border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .contact-item.active { background: rgba(0, 255, 204, 0.1); border: 1px solid var(--neon-accent); }
        .contact-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--neon-magenta); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; }
        .contact-name { font-size: 14px; font-weight: 600; }
        
        .add-contact-btn { margin: 15px; padding: 12px; background: var(--neon-accent); color: #000; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* Главный чат */
        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
        .top-bar { height: 60px; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid var(--glass-border); background: var(--glass-bg); z-index: 10; gap: 15px; }
        .toggle-btn { background: none; border: none; color: var(--neon-accent); font-size: 24px; cursor: pointer; }
        .chat-title { font-weight: 800; font-size: 16px; }

        .chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.05), transparent 60%); }
        .empty-state { margin: auto; color: var(--text-muted); text-align: center; font-size: 14px; }
        
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: slideIn 0.2s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-wrapper.received { align-self: flex-start; }
        .msg-wrapper.sent { align-self: flex-end; }
        
        .msg-bubble { padding: 10px 14px; border-radius: 14px; font-size: 14px; word-wrap: break-word; line-height: 1.4; }
        .received .msg-bubble { background: rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
        .sent .msg-bubble { background: rgba(0, 255, 204, 0.15); color: #fff; border: 1px solid rgba(0, 255, 204, 0.3); border-bottom-right-radius: 4px; }
        .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; align-self: flex-end; }

        .input-panel { padding: 10px 15px; background: var(--glass-bg); border-top: 1px solid var(--glass-border); display: flex; gap: 10px; align-items: center; }
        .chat-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(128,128,128,0.3); border-radius: 20px; padding: 12px 16px; color: var(--text-main); font-size: 14px; outline: none; }
        .chat-input:focus { border-color: var(--neon-accent); }
        .send-btn { background: var(--neon-accent); border: none; width: 44px; height: 44px; border-radius: 50%; color: #000; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Модальные окна */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-dark); border: 1px solid var(--neon-magenta); border-radius: 16px; padding: 20px; width: 90%; max-width: 320px; text-align: center; }
        .modal-title { margin-bottom: 15px; font-size: 18px; color: var(--neon-accent); }
        .form-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--text-muted); border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 15px; outline: none; font-size: 14px; text-align: center; }
        .btn-primary { width: 100%; background: var(--neon-magenta); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-secondary { width: 100%; background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); padding: 10px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- Затемнение для мобилок -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

    <!-- Боковое меню (Контакты) -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="my-profile-info" id="myProfileId">Мой ID: ...</div>
            <button class="close-menu-btn" onclick="toggleSidebar(false)">×</button>
        </div>
        <div class="contacts-list" id="contactsList">
            <!-- Контакты будут тут -->
        </div>
        <button class="add-contact-btn" onclick="openModal('addContactModal')">+ Добавить друга</button>
    </div>

    <!-- Главный экран -->
    <div class="main-chat">
        <div class="top-bar">
            <button class="toggle-btn" onclick="toggleSidebar(true)">☰</button>
            <div class="chat-title" id="currentChatTitle">CyberLink</div>
        </div>

        <div class="chat-window" id="chatWindow">
            <div class="empty-state">Открой меню (☰) и выбери чат!</div>
        </div>

        <div class="input-panel">
            <input type="text" class="chat-input" id="messageInput" placeholder="Напиши сообщение..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Модалка: Регистрация -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <div class="modal-title">Придумай себе ID</div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Этот ID ты дашь другу, чтобы он смог тебе написать.</p>
            <input type="text" class="form-input" id="myIdInput" placeholder="Например: elisey123">
            <button class="btn-primary" onclick="saveMyId()">Войти</button>
        </div>
    </div>

    <!-- Модалка: Добавить контакт -->
    <div class="modal-overlay" id="addContactModal">
        <div class="modal-content">
            <div class="modal-title">Новый чат</div>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Введи точный ID своего друга</p>
            <input type="text" class="form-input" id="friendIdInput" placeholder="ID друга">
            <button class="btn-primary" onclick="addNewContact()">Создать чат</button>
            <button class="btn-secondary" onclick="closeModal('addContactModal')">Отмена</button>
        </div>
    </div>

</div>

<script>
    let myId = "";
    let activeChatId = null;
    let chatsDatabase = {}; // Структура: { "friendId": { name: "friendId", messages: [] } }
    let ws = null;

    function initApp() {
        // Загружаем данные из памяти телефона
        const savedId = localStorage.getItem('cl_my_id');
        const savedChats = localStorage.getItem('cl_chats_db');
        
        if (savedChats) {
            chatsDatabase = JSON.parse(savedChats);
        }

        if (savedId) {
            myId = savedId;
            document.getElementById('myProfileId').innerText = `Мой ID: ${myId}`;
            renderContacts();
            connectToServer();
        } else {
            openModal('loginModal');
        }
    }

    function saveMyId() {
        const input = document.getElementById('myIdInput').value.trim().toLowerCase();
        if (!input) return alert("Введи ID!");
        myId = input;
        localStorage.setItem('cl_my_id', myId);
        document.getElementById('myProfileId').innerText = `Мой ID: ${myId}`;
        closeModal('loginModal');
        renderContacts();
        connectToServer();
    }

    // Подключение к публичному WebSocket серверу
    function connectToServer() {
        const apiKey = 'oCdCMcMPQpbvNjUIzqtvF1d2X2okWpDQj4AwARJuAgtjhzKxVEjQU6IdCjwm';
        const channelId = 'cyberlink_private_v1';
        ws = new WebSocket(`wss://demo.piesocket.com/v3/${channelId}?api_key=${apiKey}&notify_self=1`);

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                // Проверяем, адресовано ли сообщение мне
                if (data.receiver === myId) {
                    const sender = data.sender;
                    
                    // Если контакта еще нет, создаем его
                    if (!chatsDatabase[sender]) {
                        chatsDatabase[sender] = { name: sender, messages: [] };
                    }
                    
                    // Добавляем сообщение и сохраняем
                    chatsDatabase[sender].messages.push({
                        text: data.text,
                        time: data.time,
                        type: 'received'
                    });
                    
                    saveChats();
                    renderContacts();
                    
                    // Если чат с этим человеком сейчас открыт, обновляем окно
                    if (activeChatId === sender) {
                        renderMessages();
                    } else {
                        // Тут можно было бы добавить звук уведомления
                    }
                }
            } catch(e) {}
        };

        ws.onclose = () => { setTimeout(connectToServer, 3000); };
    }

    function addNewContact() {
        const friendId = document.getElementById('friendIdInput').value.trim().toLowerCase();
        if (!friendId) return;
        if (friendId === myId) return alert("Нельзя добавить самого себя!");

        if (!chatsDatabase[friendId]) {
            chatsDatabase[friendId] = { name: friendId, messages: [] };
            saveChats();
        }
        
        closeModal('addContactModal');
        document.getElementById('friendIdInput').value = '';
        renderContacts();
        openChat(friendId);
    }

    function openChat(friendId) {
        activeChatId = friendId;
        document.getElementById('currentChatTitle').innerText = friendId;
        renderContacts();
        renderMessages();
        toggleSidebar(false); // АВТОМАТИЧЕСКИ ЗАКРЫВАЕМ МЕНЮ ПРИ ВЫБОРЕ ЧАТА!
    }

    function sendMessage() {
        if (!activeChatId) return alert("Сначала выбери чат!");
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text) return;

        const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // Формируем пакет данных
        const payload = {
            sender: myId,
            receiver: activeChatId,
            text: text,
            time: timeString
        };

        // Отправляем на сервер
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify(payload));
            
            // Сохраняем у себя как отправленное
            chatsDatabase[activeChatId].messages.push({
                text: text,
                time: timeString,
                type: 'sent'
            });
            
            saveChats();
            renderMessages();
            input.value = '';
        } else {
            alert("Нет сети. Подожди...");
        }
    }

    function renderContacts() {
        const list = document.getElementById('contactsList');
        list.innerHTML = '';
        
        Object.keys(chatsDatabase).forEach(id => {
            const div = document.createElement('div');
            div.className = `contact-item ${activeChatId === id ? 'active' : ''}`;
            div.onclick = () => openChat(id);
            div.innerHTML = `
                <div class="contact-avatar">${id.charAt(0).toUpperCase()}</div>
                <div class="contact-name">@${id}</div>
            `;
            list.appendChild(div);
        });
    }

    function renderMessages() {
        const cw = document.getElementById('chatWindow');
        cw.innerHTML = '';
        
        if (!activeChatId || !chatsDatabase[activeChatId].messages.length) {
            cw.innerHTML = '<div class="empty-state">Здесь пока пусто. Напиши "Привет!"</div>';
            return;
        }

        chatsDatabase[activeChatId].messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `msg-wrapper ${msg.type}`;
            const safeText = msg.text.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
            div.innerHTML = `
                <div class="msg-bubble">${safeText}</div>
                <div class="msg-time">${msg.time}</div>
            `;
            cw.appendChild(div);
        });
        
        // Прокрутка вниз
        cw.scrollTop = cw.scrollHeight;
    }

    function saveChats() {
        localStorage.setItem('cl_chats_db', JSON.stringify(chatsDatabase));
    }

    // УПРАВЛЕНИЕ МЕНЮ (теперь нормально закрывается)
    function toggleSidebar(forceOpen) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        if (forceOpen === true) {
            sidebar.classList.add('mobile-open');
            overlay.classList.add('active');
        } else if (forceOpen === false) {
            sidebar.classList.remove('mobile-open');
            overlay.classList.remove('active');
        } else {
            sidebar.classList.toggle('mobile-open');
            overlay.classList.toggle('active');
        }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    initApp();
</script>

</body>
</html>
