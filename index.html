<!DOCTYPE html>
<html lang="ru">
<head>

  <style>
    :root {

    .msg.other { align-self: flex-start; background: var(--bubble-other); border-bottom-left-radius: 2px; }

  <main id="chat-container"></main>

  </footer>

  <script>
    const SUPABASE_URL = '[https://exrrbaeopoykofhttzvp.supabase.co](https://exrrbaeopoykofhttzvp.supabase.co)';
    const SUPABASE_KEY = 'Sb_publishable_iRcg3DReG70WfuJceOsHMw_fqUjnTuB';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const nickInput = document.getElementById('nickname');
    const keyInput = document.getElementById('secret-key');

    // Хелперы Base64
    const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const fromB64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

    // Генерация криптографического ключа из введенного пароля комнаты
    async function deriveKey(password, salt) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    // Шифрование на клиенте
    async function encryptText(text, password) {
      const enc = new TextEncoder();
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(password, salt);
      const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(text));
      return {
        ciphertext: toB64(cipher),
        iv: toB64(iv),
        salt: toB64(salt)
      };
    }

    // Расшифровка на клиенте
    async function decryptText(ciphertextB64, ivB64, saltB64, password) {
      if (!password) return { text: "🔒 Введите секретный ключ комнаты вверху", error: true };
      try {
        const salt = fromB64(saltB64);
        const iv = fromB64(ivB64);
        const cipher = fromB64(ciphertextB64);
        const key = await deriveKey(password, salt);
        const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
        return { text: new TextDecoder().decode(decrypted), error: false };
      } catch (e) {
        return { text: "🔒 Не удалось расшифровать (неверный ключ комнаты)", error: true };
      }
    }

    // Отрисовка сообщения на экране
    async function addMessageToUI(msg, currentPassword) {
      const isMine = msg.sender === nickInput.value.trim();
      const decrypted = await decryptText(msg.ciphertext, msg.iv, msg.salt, currentPassword);
      
      const el = document.createElement('div');
      el.className = `msg ${isMine ? 'mine' : 'other'}`;
      el.dataset.cipher = msg.ciphertext;
      el.dataset.iv = msg.iv;
      el.dataset.salt = msg.salt;

      const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      el.innerHTML = `
        <div class="msg-header">
          <span class="msg-sender">${msg.sender}</span>
          <span>${time}</span>
        </div>
        <div class="msg-text ${decrypted.error ? 'msg-error' : ''}">${decrypted.text}</div>
      `;
      chatContainer.appendChild(el);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Загрузка истории
    async function loadHistory() {
      chatContainer.innerHTML = '';
      const { data, error } = await client
        .from('messages')
        .select('*')
        .order('id', { ascending: true })
        .limit(100);

      if (!error && data) {
        const pwd = keyInput.value.trim();
        for (const msg of data) {
          await addMessageToUI(msg, pwd);
        }
      }
    }

    // Отправка нового сообщения
    async function sendMessage() {
      const text = msgInput.value.trim();
      const password = keyInput.value.trim();
      const sender = nickInput.value.trim() || 'Аноним';

      if (!text) return;
      if (!password) {
        alert("Задайте секретный ключ (пароль комнаты) в шапке сайта!");
        return;
      }

      msgInput.value = '';
      const { ciphertext, iv, salt } = await encryptText(text, password);

      const { error } = await client.from('messages').insert([{
        sender,
        ciphertext,
        iv,
        salt
      }]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
    
    // Перерасшифровать сообщения на лету при смене ключа
    keyInput.addEventListener('input', () => {
      loadHistory();
    });

    // Режим реального времени (WebSockets)
    client
      .channel('realtime:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        addMessageToUI(payload.new, keyInput.value.trim());
      })
      .subscribe();

    loadHistory();
  </script>
</body>
