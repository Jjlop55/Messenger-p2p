<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CyberLink P2P Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-dark: #07070b;
            --glass-bg: rgba(20, 20, 35, 0.75);
            --glass-border: rgba(0, 255, 204, 0.15);
            --neon-accent: #00ffcc;
            --neon-magenta: #ff007f;
            --neon-blue: #0088ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            --status-online: #00ffcc;
            --status-afk: #ffcc00;
            --status-dnd: #ff3333;
        }

        body.theme-neon {
            --bg-dark: #05020a; --glass-bg: rgba(30, 10, 40, 0.8); --glass-border: rgba(255, 0, 127, 0.3);
            --neon-accent: #ff007f; --neon-blue: #b829ff;
        }

        body.theme-whatsapp {
            --bg-dark: #efeae2; --glass-bg: #f0f2f5; --glass-border: #d1d7db;
            --neon-accent: #25d366; --neon-magenta: #00a884; --neon-blue: #34b7f1;
            --text-main: #111b21; --text-muted: #667781; background-image: none;
        }
        body.theme-whatsapp .top-bar { background: #008069; color: #ffffff; border-bottom: none; }
        body.theme-whatsapp .top-bar .chat-title, body.theme-whatsapp .top-bar .toggle-sidebar-btn, body.theme-whatsapp .top-bar .action-btn { color: #ffffff; border: none; background: transparent; }
        body.theme-whatsapp .sidebar { background: #ffffff; border-right: 1px solid #d1d7db; }
        body.theme-whatsapp .chat-icon { background: transparent; color: #54656f; }
        body.theme-whatsapp .chat-icon.active { background: #25d366; color: #ffffff; border-radius: 50%; box-shadow: none; }
        body.theme-whatsapp .msg-bubble { background: #ffffff; color: #111b21; border: none; box-shadow: 0 1px 0.5px rgba(11,20,26,.13); border-radius: 0 8px 8px 8px; }
        body.theme-whatsapp .msg-wrapper.sent .msg-bubble { background: #d9fdd3; color: #111b21; border-radius: 8px 0 8px 8px; }
        body.theme-whatsapp .msg-sender-name { color: #00a884; font-weight: 600; }
        body.theme-whatsapp .msg-wrapper.sent .msg-sender-name { color: #128c7e; }
        body.theme-whatsapp .chat-input { background: #ffffff; color: #111b21; border: none; border-radius: 20px; }
        body.theme-whatsapp .modal-content { background: #ffffff; color: #111b21; border: none; }
        body.theme-whatsapp .form-input { background: #f0f2f5; color: #111b21; border: 1px solid #d1d7db; }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { font-family: 'Montserrat', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100dvh; width: 100vw; overflow: hidden; display: flex; background-image: radial-gradient(circle at 15% 50%, rgba(0, 255, 204, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.08), transparent 25%); transition: 0.3s; }

        .app-container { display: flex; width: 100%; height: 100%; position: relative; }

        .sidebar { position: absolute; left: 0; top: 0; width: 75px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 12px 0; background: var(--bg-dark); backdrop-filter: blur(16px); border-right: 1px solid var(--glass-border); z-index: 1000; transform: translateX(-100%); transition: 0.3s; }
        .sidebar.mobile-open { transform: translateX(0); }
        .chats-container { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; overflow-y: auto; gap: 12px; }
        .chats-container::-webkit-scrollbar { display: none; }
        .chat-icon { width: 44px; height: 44px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; position: relative; transition: 0.3s; flex-shrink: 0; }
        .chat-icon.active { border-radius: 35%; background: var(--neon-accent); color: var(--bg-dark); box-shadow: 0 0 12px var(--neon-accent); }
        .status-indicator { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg-dark); }
        .online { background: var(--status-online); box-shadow: 0 0 6px var(--status-online); }
        .dnd { background: var(--status-dnd); }
        .divider { width: 35px; height: 2px; background: rgba(128,128,128,0.2); margin: 8px 0; border-radius: 2px; }

        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; width: 100%; }
        .top-bar { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--glass-border); background: var(--glass-bg); backdrop-filter: blur(10px); z-index: 10; }
        .chat-info { display: flex; align-items: center; gap: 8px; }
        .toggle-sidebar-btn { background: none; border: none; color: var(--neon-accent); font-size: 20px; cursor: pointer; }
        .chat-title { font-weight: 800; font-size: 14px; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .encryption-badge { font-size: 10px; color: var(--status-online); border: 1px solid var(--status-online); padding: 2px 6px; border-radius: 10px; font-weight: 600; display: none; }
        
        .top-actions { display: flex; gap: 6px; }
        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(128,128,128,0.2); border-radius: 10px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-main); font-size: 14px; cursor: pointer; }

        .chat-window { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-wrapper { display: flex; gap: 8px; max-width: 90%; animation: slideIn 0.3s ease forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
        .msg-avatar { width: 30px; height: 30px; border-radius: 8px; background: #2a2a35; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(128,128,128,0.2); font-weight: bold; font-size: 13px; color: var(--neon-accent); }
        .msg-bubble-container { display: flex; flex-direction: column; }
        .msg-sender-name { font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .msg-wrapper.sent .msg-sender-name { text-align: right; color: var(--neon-accent); }
        .msg-bubble { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 0 12px 12px 12px; font-size: 13px; word-break: break-word; }
        .msg-wrapper.sent .msg-bubble { background: rgba(0, 255, 204, 0.1); border-radius: 12px 0 12px 12px; color: #fff; }
        .msg-time { font-size: 9px; color: var(--text-muted); margin-top: 4px; text-align: right; }
        .media-content { max-width: 100%; border-radius: 6px; }
        .system-msg { align-self: center; background: rgba(128, 128, 128, 0.1); color: var(--text-muted); padding: 5px 12px; border-radius: 16px; font-size: 11px; margin: 6px 0; }

        .input-panel { padding: 8px 10px; background: var(--glass-bg); border-top: 1px solid var(--glass-border); display: flex; align-items: center; gap: 6px; }
        .input-btn { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
        .chat-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(128,128,128,0.2); border-radius: 18px; padding: 7px 12px; color: var(--text-main); outline: none; font-size: 13px; }
        .send-btn { background: var(--neon-accent); border: none; width: 34px; height: 34px; border-radius: 50%; color: #fff; cursor: pointer; }

        /* Экран звонка */
        .call-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 3000; display: none; flex-direction: column; }
        .call-overlay.active { display: flex; }
        .call-videos { flex: 1; position: relative; background: #000; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 100px; height: 150px; position: absolute; bottom: 20px; right: 20px; border-radius: 12px; object-fit: cover; border: 2px solid var(--neon-accent); background: #222; }
        .call-controls { height: 80px; display: flex; justify-content: center; align-items: center; gap: 20px; background: var(--glass-bg); }
        .call-btn { width: 50px; height: 50px; border-radius: 50%; border: none; font-size: 24px; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-end { background: var(--status-dnd); }
        .btn-accept { background: var(--status-online); color: #000; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--bg-dark); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; width: 90%; max-width: 340px; position: relative; }
        .close-modal { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-muted); font-size: 20px; }
        .form-input { width: 100%; background: rgba(128,128,128,0.1); border: 1px solid rgba(128,128,128,0.2); border-radius: 6px; padding: 8px; color: var(--text-main); margin-bottom: 10px; outline: none; }
        .save-btn { width: 100%; background: var(--neon-magenta); color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body class="theme-cyber">

<div class="app-container">

    <div class="sidebar" id="sidebar">
        <div class="chats-container" id="chatsList"></div>
        <div class="divider"></div>
        <div class="profile-bar" style="margin-top: auto; padding: 10px 0; display: flex; flex-direction: column; gap: 8px;">
            <div class="action-btn" onclick="openModal('networkModal')">🌐</div>
            <div class="action-btn" onclick="openModal('settingsModal')">⚙️</div>
            <div class="msg-avatar" onclick="openModal('profileModal')" id="sidebarAvatar" style="cursor: pointer; border-color: var(--neon-magenta);">?</div>
        </div>
    </div>

    <div class="main-chat" id="mainChatArea">
        <div class="top-bar">
            <div class="chat-info">
                <button class="toggle-sidebar-btn" onclick="toggleSidebar()">☰</button>
                <div class="chat-title"><span id="chatTitleText">local-notes</span> <span class="encryption-badge" id="encBadge">🔒 E2E</span></div>
            </div>
            <div class="top-actions">
                <button class="action-btn" id="callBtn" onclick="startCall()" style="display:none;" title="Позвонить">📞</button>
                <button class="action-btn" onclick="openModal('networkModal')" title="Найти по юзернейму">🔍</button>
            </div>
        </div>

        <div class="chat-window" id="chatWindow"></div>

        <div class="input-panel">
            <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
            <button class="input-btn" id="attachBtn">📎</button>
            <input type="text" class="chat-input" id="messageInput" placeholder="Сообщение...">
            <button class="send-btn" onclick="handleSendText()">➤</button>
        </div>
    </div>

    <!-- Экран звонка -->
    <div class="call-overlay" id="callOverlay">
        <div class="call-videos">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="call-controls">
            <button class="call-btn btn-accept" id="acceptCallBtn" style="display: none;" onclick="answerCall()">📞</button>
            <button class="call-btn btn-end" onclick="endCall()">✖</button>
        </div>
    </div>

    <!-- Модалки -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('profileModal')">×</button>
            <h2 style="color: var(--neon-magenta); font-size: 16px; margin-bottom: 10px;">Профиль</h2>
            <label style="font-size: 10px; color: var(--text-muted);">Имя</label>
            <input type="text" class="form-input" id="editNickname">
            <label style="font-size: 10px; color: var(--text-muted);">@Юзернейм (для поиска)</label>
            <input type="text" class="form-input" id="editUsername" placeholder="Например: my_nick">
            <button class="save-btn" onclick="saveProfile()">Сохранить & Подключиться к сети</button>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('settingsModal')">×</button>
            <h2 style="font-size: 16px; margin-bottom: 10px;">Настройки</h2>
            <select class="form-input" id="themeSelect" onchange="changeTheme(this.value)">
                <option value="cyber">Темная (Киберпанк)</option>
                <option value="neon">Неоновый фиолет</option>
                <option value="whatsapp">Светлая (WhatsApp стиль)</option>
            </select>
        </div>
    </div>

    <div class="modal-overlay" id="networkModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('networkModal')">×</button>
            <h2 style="color: var(--neon-blue); font-size: 16px; margin-bottom: 10px;">Найти друга</h2>
            <div style="font-size: 11px; color: var(--status-online); margin-bottom: 10px;" id="myNetStatus">Сеть отключена. Настрой юзернейм в профиле!</div>
            <label style="font-size: 10px; color: var(--text-muted);">@Юзернейм друга</label>
            <input type="text" class="form-input" id="friendUsername" placeholder="Введи ник друга">
            <button class="save-btn" style="background: var(--neon-blue);" onclick="connectToFriend()">Начать чат</button>
            <div id="connectionStatus" style="font-size: 11px; margin-top: 8px; text-align: center;">Ожидание...</div>
        </div>
    </div>

</div>

<script>
    let userProfile = { name: "Гость", username: "", theme: "cyber" };
    let chatsData = {
        'local': { id: 'local', title: 'Локальные заметки', icon: '📝', messages: [{ type: 'system', text: 'Заметки только на твоем устройстве.' }] },
        'p2p': { id: 'p2p', title: 'P2P Чат', icon: '🔗', isP2P: true, messages: [{ type: 'system', text: 'Зашифрованный P2P канал.' }] }
    };
    let currentChatId = 'local';
    
    // Сеть и звонки
    let peer = null; let p2pConnection = null; let currentCall = null; let localStream = null;

    function initApp() {
        const saved = localStorage.getItem('cyblink_prof');
        if (saved) userProfile = JSON.parse(saved);
        
        const savedChats = localStorage.getItem('cyblink_chats');
        if (savedChats) chatsData = JSON.parse(savedChats);

        document.getElementById('editNickname').value = userProfile.name;
        document.getElementById('editUsername').value = userProfile.username;
        changeTheme(userProfile.theme);

        renderSidebarChats();
        switchChat('local');
        updateAvatar();

        // Если юзернейм есть, сразу логинимся в сеть
        if(userProfile.username) initPeer();
    }

    function initPeer() {
        if(peer) peer.destroy();
        // Используем юзернейм как уникальный ID для серверов PeerJS (добавляем префикс для уникальности приложения)
        const myPeerId = 'clink-' + userProfile.username.toLowerCase().trim();
        
        peer = new Peer(myPeerId);
        
        peer.on('open', (id) => {
            document.getElementById('myNetStatus').innerText = `В сети как: @${userProfile.username}`;
        });

        peer.on('connection', (conn) => setupP2P(conn));
        
        // Входящий звонок
        peer.on('call', (call) => {
            currentCall = call;
            document.getElementById('callOverlay').classList.add('active');
            document.getElementById('acceptCallBtn').style.display = 'flex';
        });
    }

    function saveProfile() {
        userProfile.name = document.getElementById('editNickname').value || "User";
        userProfile.username = document.getElementById('editUsername').value.replace('@','').trim();
        localStorage.setItem('cyblink_prof', JSON.stringify(userProfile));
        updateAvatar();
        closeModal('profileModal');
        if(userProfile.username) initPeer();
    }

    function connectToFriend() {
        let friend = document.getElementById('friendUsername').value.replace('@','').trim().toLowerCase();
        if(!friend || !peer) return;
        
        document.getElementById('connectionStatus').innerText = "Ищем " + friend + "...";
        const conn = peer.connect('clink-' + friend);
        setupP2P(conn);
    }

    function setupP2P(conn) {
        p2pConnection = conn;
        conn.on('open', () => {
            document.getElementById('connectionStatus').innerText = "Подключено!";
            addMsg('p2p', { type: 'system', text: 'Защищенное соединение E2E установлено.' });
            switchChat('p2p');
            closeModal('networkModal');
        });
        conn.on('data', (data) => {
            if (data.type === 'chat') { 
                data.senderId = 'friend'; 
                addMsg('p2p', data); 
            }
        });
        conn.on('close', () => addMsg('p2p', { type: 'system', text: 'Собеседник отключился.' }));
    }

    // ЗВОНКИ
    async function getMediaStream() {
        try {
            return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) { alert("Разреши доступ к камере и микрофону!"); return null; }
    }

    async function startCall() {
        if (!p2pConnection) return alert("Сначала подключись к другу в поиске!");
        localStream = await getMediaStream();
        if(!localStream) return;
        
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');
        document.getElementById('acceptCallBtn').style.display = 'none';

        currentCall = peer.call(p2pConnection.peer, localStream);
        handleCallEvents(currentCall);
    }

    async function answerCall() {
        localStream = await getMediaStream();
        if(!localStream) return;
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('acceptCallBtn').style.display = 'none';
        
        currentCall.answer(localStream);
        handleCallEvents(currentCall);
    }

    function handleCallEvents(call) {
        call.on('stream', (remoteStream) => {
            document.getElementById('remoteVideo').srcObject = remoteStream;
        });
        call.on('close', endCall);
    }

    function endCall() {
        if(currentCall) currentCall.close();
        if(localStream) localStream.getTracks().forEach(track => track.stop());
        document.getElementById('callOverlay').classList.remove('active');
        document.getElementById('remoteVideo').srcObject = null;
        document.getElementById('localVideo').srcObject = null;
    }

    // ЧАТ & UI
    function handleSendText() {
        const text = document.getElementById('messageInput').value.trim();
        if (!text) return;
        
        const msg = { type: 'chat', senderId: 'me', senderName: userProfile.name, text: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
        addMsg(currentChatId, msg);
        
        if(currentChatId === 'p2p' && p2pConnection) p2pConnection.send(msg);
        document.getElementById('messageInput').value = '';
    }

    function addMsg(chatId, msg) {
        chatsData[chatId].messages.push(msg);
        localStorage.setItem('cyblink_chats', JSON.stringify(chatsData));
        if(currentChatId === chatId) renderMessages();
    }

    function renderMessages() {
        const cw = document.getElementById('chatWindow');
        cw.innerHTML = '';
        chatsData[currentChatId].messages.forEach(msg => {
            const div = document.createElement('div');
            if (msg.type === 'system') {
                div.className = 'system-msg'; div.innerText = msg.text;
            } else {
                div.className = `msg-wrapper ${msg.senderId === 'me' ? 'sent' : 'received'}`;
                const textHTML = msg.text.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
                div.innerHTML = `
                    <div class="msg-avatar">${msg.senderName.charAt(0).toUpperCase()}</div>
                    <div class="msg-bubble-container">
                        <div class="msg-sender-name">${msg.senderName}</div>
                        <div class="msg-bubble">${textHTML}</div>
                        <div class="msg-time">${msg.time || ''}</div>
                    </div>`;
            }
            cw.appendChild(div);
        });
        cw.scrollTo(0, cw.scrollHeight);
    }

    function switchChat(id) {
        currentChatId = id;
        document.getElementById('chatTitleText').innerText = chatsData[id].title;
        document.getElementById('encBadge').style.display = (id === 'p2p') ? 'inline-block' : 'none';
        document.getElementById('callBtn').style.display = (id === 'p2p') ? 'flex' : 'none';
        renderSidebarChats();
        renderMessages();
        document.getElementById('sidebar').classList.remove('mobile-open');
    }

    function renderSidebarChats() {
        const cl = document.getElementById('chatsList');
        cl.innerHTML = '';
        Object.values(chatsData).forEach(chat => {
            const d = document.createElement('div');
            d.className = `chat-icon ${chat.id === currentChatId ? 'active' : ''}`;
            d.onclick = () => switchChat(chat.id);
            d.innerText = chat.icon;
            if(chat.isP2P) d.innerHTML += `<div class="status-indicator ${p2pConnection ? 'online' : 'dnd'}"></div>`;
            cl.appendChild(d);
        });
    }

    function changeTheme(t) { document.body.className = t === 'cyber' ? '' : `theme-${t}`; userProfile.theme = t; localStorage.setItem('cyblink_prof', JSON.stringify(userProfile)); }
    function updateAvatar() { document.getElementById('sidebarAvatar').innerText = userProfile.name.charAt(0).toUpperCase(); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('mobile-open'); }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    initApp();
</script>

</body>
</html>
