<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Web Messenger</title>
  <!-- MQTT.js CDN -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0e1621;
      color: #ffffff;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 760px;
      height: 100vh;
      background-color: #17212b;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    @media (min-width: 768px) {
      .chat-container {
        height: 90vh;
        border-radius: 12px;
        overflow: hidden;
      }
    }

    .header {
      padding: 14px 20px;
      background-color: #242f3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #111922;
    }

    .header-info h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .status {
      font-size: 12px;
      color: #ffa500;
      transition: color 0.3s;
    }

    .status.online {
      color: #4fae4e;
    }

    .user-btn {
      background: #2b5278;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 75%;
      padding: 8px 12px;
      border-radius: 10px;
      background-color: #182533;
      align-self: flex-start;
      word-wrap: break-word;
    }

    .message.own {
      background-color: #2b5278;
      align-self: flex-end;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 4px;
    }

    .message-sender {
      font-size: 13px;
      font-weight: 700;
      color: #64b5f6;
    }

    .message.own .message-sender {
      color: #bbdefb;
    }

    .message-time {
      font-size: 11px;
      color: #7f91a4;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .input-area {
      padding: 12px 16px;
      background-color: #242f3d;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      background-color: #17212b;
      border: 1px solid #0e1621;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .input-area button {
      background-color: #5288c1;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #242f3d;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal input {
      background: #17212b;
      border: 1px solid #0e1621;
      border-radius: 6px;
      padding: 10px;
      color: #fff;
      outline: none;
    }

    .modal button {
      background: #5288c1;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="nicknameModal">
    <div class="modal">
      <h3>Введите ваш ник</h3>
      <input type="text" id="nicknameInput" placeholder="Например: Player" maxlength="20" />
      <button id="saveNickBtn">Войти в чат</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="header">
      <div class="header-info">
        <h2>Онлайн Чат</h2>
        <span class="status" id="statusText">● Подключение...</span>
      </div>
      <button class="user-btn" id="changeNickBtn">Ник: ...</button>
    </div>

    <div class="messages-area" id="messagesList"></div>

    <form class="input-area" id="messageForm">
      <input type="text" id="msgInput" placeholder="Напишите сообщение..." autocomplete="off" />
      <button type="submit">Отправить</button>
    </form>
  </div>

  <script>
    // Публичный WebSocket MQTT брокер (без регистрации и ключей)
    const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_NAME = 'utopia_public_global_chat_channel_v1';

    let currentNick = localStorage.getItem('chat_nickname') || '';
    const clientId = 'user_' + Math.random().toString(16).substring(2, 10);

    const client = mqtt.connect(BROKER_URL, {
      clientId: clientId,
      clean: true,
      connectTimeout: 4000,
      reconnectPeriod: 1000
    });

    const statusText = document.getElementById('statusText');
    const modal = document.getElementById('nicknameModal');
    const nickInput = document.getElementById('nicknameInput');
    const saveNickBtn = document.getElementById('saveNickBtn');
    const changeNickBtn = document.getElementById('changeNickBtn');
    const messageForm = document.getElementById('messageForm');
    const msgInput = document.getElementById('msgInput');
    const messagesList = document.getElementById('messagesList');

    // Подключение к брокеру
    client.on('connect', () => {
      statusText.textContent = '● В сети (WebSocket)';
      statusText.classList.add('online');
      client.subscribe(TOPIC_NAME);
    });

    client.on('offline', () => {
      statusText.textContent = '● Переподключение...';
      statusText.classList.remove('online');
    });

    // Обработка входящих сообщений
    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        if (data.sender && data.text && data.timestamp) {
          renderMessage(data);
        }
      } catch (err) {
        console.error('Ошибка парсинга:', err);
      }
    });

    function initUser() {
      if (!currentNick) {
        modal.style.display = 'flex';
        nickInput.focus();
      } else {
        modal.style.display = 'none';
        changeNickBtn.textContent = 'Ник: ' + currentNick;
      }
    }

    saveNickBtn.addEventListener('click', () => {
      const val = nickInput.value.trim();
      if (val) {
        currentNick = val;
        localStorage.setItem('chat_nickname', currentNick);
        initUser();
      }
    });

    changeNickBtn.addEventListener('click', () => {
      nickInput.value = currentNick;
      modal.style.display = 'flex';
      nickInput.focus();
    });

    // Отправка сообщений
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text || !currentNick) return;

      const payload = {
        sender: currentNick,
        text: text,
        timestamp: Date.now()
      };

      // Публикуем сообщение в общий канал
      client.publish(TOPIC_NAME, JSON.stringify(payload));
      msgInput.value = '';
    });

    function escapeText(str) {
      const p = document.createElement('p');
      p.textContent = str;
      return p.innerHTML;
    }

    function renderMessage(data) {
      const isOwn = data.sender === currentNick;
      const timeStr = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : ''}`;
      msgEl.innerHTML = `
        <div class="message-header">
          <span class="message-sender">${escapeText(data.sender)}</span>
          <span class="message-time">${timeStr}</span>
        </div>
        <div class="message-text">${escapeText(data.text)}</div>
      `;

      messagesList.appendChild(msgEl);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    initUser();
  </script>
</body>
</html>
