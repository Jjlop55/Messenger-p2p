<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utopia Messenger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0b0f19;
      color: #f3f4f6;
      height: 100vh;
      display: flex;
    }

    /* Экран авторизации */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #151c2c;
      border: 1px solid #243048;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-card h2 {
      font-size: 1.25rem;
      color: #38bdf8;
      text-align: center;
    }
    .auth-card input, .auth-card button {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      border: 1px solid #2c3c5a;
      background: #0b0f19;
      color: #fff;
      outline: none;
    }
    .auth-card button {
      background: #0284c7;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-card button:hover {
      background: #0369a1;
    }

    /* Главный интерфейс */
    #app {
      display: none;
      width: 100vw;
      height: 100vh;
    }

    /* Список чатов */
    aside {
      width: 280px;
      background: #111726;
      border-right: 1px solid #243048;
      display: flex;
      flex-direction: column;
    }
    .user-profile {
      padding: 16px;
      border-bottom: 1px solid #243048;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-controls {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid #243048;
    }
    .chat-controls button {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #1f2a40;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .chat-controls button:hover {
      background: #2c3c5a;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      background: transparent;
      font-size: 14px;
    }
    .chat-item:hover {
      background: #182238;
    }
    .chat-item.active {
      background: #0284c7;
      color: #fff;
    }

    /* Окно переписки */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0b0f19;
    }
    .chat-header {
      padding: 14px 20px;
      border-bottom: 1px solid #243048;
      background: #111726;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .invite-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: #16a34a;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .messages-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      word-break: break-word;
    }
    .msg.mine {
      align-self: flex-end;
      background: #0369a1;
      border-bottom-right-radius: 2px;
    }
    .msg.other {
      align-self: flex-start;
      background: #1a2336;
      border-bottom-left-radius: 2px;
    }
    .msg-author {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .msg.mine .msg-author {
      color: #bae6fd;
    }

    .chat-input-bar {
      padding: 14px 20px;
      background: #111726;
      border-top: 1px solid #243048;
      display: flex;
      gap: 10px;
    }
    .chat-input-bar input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #243048;
      background: #0b0f19;
      color: #fff;
      outline: none;
    }
    .chat-input-bar button {
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Окно входа / регистрации -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>Utopia Messenger</h2>
      <p style="font-size: 12px; color: #94a3b8; text-align: center;">При первом входе аккаунт создаётся автоматически</p>
      <input type="text" id="login-nick" placeholder="Ваш никнейм" autocomplete="off">
      <input type="password" id="login-pwd" placeholder="Пароль">
      <button id="auth-btn">Войти в сеть</button>
      <div id="auth-error" style="color: #f87171; font-size: 12px; text-align: center;"></div>
    </div>
  </div>

  <!-- Главное окно приложения -->
  <div id="app">
    <aside>
      <div class="user-profile">
        <span id="profile-nick">@nickname</span>
        <button onclick="location.reload()" style="background:none; border:none; color:#f87171; cursor:pointer;">Выйти</button>
      </div>
      <div class="chat-controls">
        <button id="new-chat-btn">+ Создать чат</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </aside>

    <main>
      <div class="chat-header">
        <h3 id="current-chat-title">🌐 Общий чат</h3>
        <button id="invite-btn" class="invite-btn" style="display: none;">+ Пригласить друга</button>
      </div>
      <div class="messages-box" id="messages-box"></div>
      <div class="chat-input-bar">
        <input type="text" id="msg-input" placeholder="Напишите сообщение..." autocomplete="off">
        <button id="send-msg-btn">Отправить</button>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = "https://utopia-messenger-api.onrender.com";

    let currentUser = null;
    let activeChatId = "general";
    let activeWs = null;

    // Вход / Регистрация
    document.getElementById('auth-btn').addEventListener('click', async () => {
      const nickname = document.getElementById('login-nick').value.trim();
      const password = document.getElementById('login-pwd').value;
      const errBox = document.getElementById('auth-error');
      errBox.innerText = '';

      if (!nickname || !password) {
        errBox.innerText = 'Заполните все поля!';
        return;
      }

      try {
        const res = await fetch(`${BACKEND_URL}/auth`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, password })
        });
        const data = await res.json();

        if (data.status === 'ok') {
          currentUser = nickname;
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app').style.display = 'flex';
          document.getElementById('profile-nick').innerText = '@' + currentUser;

          // Автоматическая регистрация общего чата
          await fetch(`${BACKEND_URL}/chats`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: 'general', name: '🌐 Общий чат', created_by: currentUser })
          });

          await loadChats();
          switchChat('general', '🌐 Общий чат');
        } else {
          errBox.innerText = data.msg;
        }
      } catch (e) {
        errBox.innerText = 'Сервер просыпается... Подождите около 30 секунд и нажмите ещё раз.';
      }
    });

    // Получение списка чатов
    async function loadChats() {
      try {
        const res = await fetch(`${BACKEND_URL}/chats/${currentUser}`);
        const chats = await res.json();
        const listEl = document.getElementById('chat-list');
        listEl.innerHTML = '';

        chats.forEach(c => {
          const div = document.createElement('div');
          div.className = `chat-item ${c.id === activeChatId ? 'active' : ''}`;
          div.innerText = c.name;
          div.onclick = () => switchChat(c.id, c.name);
          listEl.appendChild(div);
        });
      } catch (e) {
        console.error("Ошибка загрузки комнат:", e);
      }
    }

    // Переключение чата
    async function switchChat(chatId, chatName) {
      activeChatId = chatId;
      document.getElementById('current-chat-title').innerText = chatName;
      document.getElementById('invite-btn').style.display = chatId === 'general' ? 'none' : 'block';

      document.querySelectorAll('.chat-item').forEach(el => {
        el.classList.toggle('active', el.innerText === chatName);
      });

      // История сообщений
      const box = document.getElementById('messages-box');
      box.innerHTML = '';
      try {
        const res = await fetch(`${BACKEND_URL}/messages/${chatId}`);
        const history = await res.json();
        history.forEach(renderMessage);
      } catch (e) {
        console.error("Ошибка истории:", e);
      }

      // Переподключение WebSocket
      if (activeWs) {
        activeWs.close();
      }

      const wsProtocol = BACKEND_URL.startsWith('https') ? 'wss://' : 'ws://';
      const wsHost = BACKEND_URL.replace(/^https?:\/\//, '');
      const wsUrl = `${wsProtocol}${wsHost}/ws/${chatId}`;

      activeWs = new WebSocket(wsUrl);

      activeWs.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        renderMessage(msg);
      };
    }

    function renderMessage(msg) {
      const box = document.getElementById('messages-box');
      const isMine = msg.sender === currentUser;
      const el = document.createElement('div');
      el.className = `msg ${isMine ? 'mine' : 'other'}`;
      el.innerHTML = `
        <div class="msg-author">${msg.sender}</div>
        <div class="msg-body">${msg.text}</div>
      `;
      box.appendChild(el);
      box.scrollTop = box.scrollHeight;
    }

    // Отправка сообщения
    function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !activeWs || activeWs.readyState !== WebSocket.OPEN) return;

      activeWs.send(JSON.stringify({ sender: currentUser, text: text }));
      input.value = '';
    }

    document.getElementById('send-msg-btn').addEventListener('click', sendMsg);
    document.getElementById('msg-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMsg();
    });

    // Создание приватного чата
    document.getElementById('new-chat-btn').addEventListener('click', async () => {
      const name = prompt('Название нового чата:');
      if (!name) return;
      const id = 'chat_' + Date.now();

      await fetch(`${BACKEND_URL}/chats`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, name, created_by: currentUser })
      });

      await loadChats();
      switchChat(id, name);
    });

    // Приглашение друга
    document.getElementById('invite-btn').addEventListener('click', async () => {
      const friend = prompt('Никнейм друга:');
      if (!friend) return;

      const res = await fetch(`${BACKEND_URL}/invite`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: activeChatId, nickname: friend })
      });
      const data = await res.json();
      if (data.status === 'ok') {
        alert(`@${friend} успешно добавлен!`);
      } else {
        alert(data.msg);
      }
    });
  </script>
</body>
</html>
